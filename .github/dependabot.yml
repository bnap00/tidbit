# Dependency updates. Security updates are on in repo settings; these are the routine
# version bumps. The 3-day cooldown matches minimumReleaseAge in pnpm-workspace.yaml.
version: 2
updates:
  # pnpm workspace: one lockfile at the root covers apps/* and packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3

  # Speech services in compose.speech.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3
